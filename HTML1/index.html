<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Tags Example</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>HTML Media Tags Example</h1>

        <h2>Link Tag</h2>
        <a href="https://google.com" target="_blank">Visit Google</a>


        <h2>Image Tag</h2>
        <img src="./media/images/batman.png" alt="Batman Image">


        <h2>Video Tag</h2>
        <video controls autoplay muted>
            <source src="./media/thalapathy.mp4" type="video/mp4" alt="error">
        </video>


        <h2>Audio Tag</h2>
        <audio controls>
            <source src="./media/Theekkoluthi.mp3" type="audio/mp3">
        </audio>

        <h2>Iframe Tag</h2>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/07rwVa8Hb84?si=12dVUGidcTZ5Uk6H" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    </div>

</body>
</html>
