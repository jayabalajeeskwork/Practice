<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div id="box">
        <h1>HTML Media Tags</h1>
        <h3>Link Tag</h3>
        <a href="https://jayabalajeesk-portfolio-flax-xi.vercel.app/" target="_blank">Visit Portfolio</a>

        <h3>Image tag</h3>
        <img src="./media/images/batman.png" alt="batman logo">

        <h3>Video Tag</h3>
        <video autoplay muted controls>
            <source src="./media/thalapathy.mp4" type="video/mp4" alt="error">
        </video>

        <h3>Audio Tag</h3>
        <audio controls>
            <source src="./media/Theekkoluthi.mp3" type="audio/mp3" alt="error">
        </audio>

        <h3>Iframe Tag</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/ovczHJiTHSY?si=fIUOBYXXi-eh--em"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>



        <i class="fa-solid fa-house"></i>
    </div>
</body>

</html>
